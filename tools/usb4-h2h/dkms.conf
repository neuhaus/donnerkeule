# bos_usb4h2h: sends AMD's USB4 H2H Enhancement through the SMU (see README.md).
# Install: sudo cp -r tools/usb4-h2h /usr/src/usb4-h2h-1.0 && sudo dkms install usb4-h2h/1.0
# The module has no device table, so nothing loads it on its own; usb4-h2h.sh does.
PACKAGE_NAME="usb4-h2h"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="bos_usb4h2h"
DEST_MODULE_LOCATION[0]="/extra"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
AUTOINSTALL="yes"
